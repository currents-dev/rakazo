name: Upload test results to Currents

# Fork pull request jobs get no secrets, so ci.yml saves Vitest JUnit as artifacts and this
# workflow uploads them with the record key. It runs the default branch's copy of this file and
# never checks out or runs the pull request's code: the artifacts are only read as XML.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  vitest:
    name: Upload Vitest results
    if: github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download JUnit artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: currents-junit-*-${{ github.event.workflow_run.run_attempt }}
          path: ${{ runner.temp }}/junit
          merge-multiple: true
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Upload to Currents
        working-directory: ${{ runner.temp }}
        env:
          CURRENTS_PROJECT_ID: ${{ vars.CURRENTS_VITEST_PROJECT_ID }}
          CURRENTS_RECORD_KEY: ${{ secrets.CURRENTS_RECORD_KEY }}
          CURRENTS_CI_BUILD_ID: ${{ github.repository }}-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}-vitest
          # The upload runs on the default branch, so the commit it describes comes from the CI run.
          COMMIT_INFO_SHA: ${{ github.event.workflow_run.head_sha }}
          COMMIT_INFO_BRANCH: ${{ github.event.workflow_run.head_branch }}
          COMMIT_INFO_MESSAGE: ${{ github.event.workflow_run.head_commit.message }}
          COMMIT_INFO_AUTHOR: ${{ github.event.workflow_run.head_commit.author.name }}
          COMMIT_INFO_EMAIL: ${{ github.event.workflow_run.head_commit.author.email }}
          COMMIT_INFO_REMOTE: ${{ github.event.workflow_run.head_repository.clone_url }}
        run: |
          if ! compgen -G "junit/*.xml" > /dev/null; then
            echo "No JUnit files in this CI run; nothing to upload."
            exit 0
          fi
          npx --yes @currents/cmd@3.0.0 run upload \
            --input-format junit \
            --input-file "junit/*.xml" \
            --framework vitest
